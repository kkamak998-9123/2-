<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실손보험 세대별 청구액 계산기</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>실손보험 세대별 청구액 계산기</h1>
    <p class="sub">영수증에 찍힌 금액을 입력하면 1~4세대 실손보험 기준으로<br />
      예상 수령액을 한눈에 비교해드립니다.</p>
  </header>

  <main>
    <form id="calcForm">
      <div class="row">
        <label>진료 구분
          <select id="careType">
            <option value="통원">통원(외래)</option>
            <option value="입원">입원</option>
            <option value="처방조제">처방조제</option>
          </select>
        </label>
        <label id="hospitalTypeWrap">병원 종별
          <select id="hospitalType">
            <option value="의원">의원</option>
            <option value="병원">병원·종합병원</option>
            <option value="상급종합">상급종합병원</option>
          </select>
        </label>
      </div>

      <div class="row">
        <label>급여 본인부담금 (원)
          <input type="number" id="paidCopay" min="0" step="1000" placeholder="예: 30000" />
        </label>
        <label>비급여 금액 (원)
          <input type="number" id="nonpaid" min="0" step="1000" placeholder="예: 50000" />
        </label>
      </div>

      <fieldset>
        <legend>중요 특약 대상 비급여 <span class="muted">(해당 시 별도 입력 · 3·4세대만 특약 규칙 적용)</span></legend>
        <div class="row">
          <label>도수·체외충격파·증식치료 (원)
            <input type="number" id="riderDosu" min="0" step="1000" placeholder="0" />
          </label>
          <label>비급여 주사 (원)
            <input type="number" id="riderInjection" min="0" step="1000" placeholder="0" />
          </label>
          <label>비급여 MRI/MRA (원)
            <input type="number" id="riderMri" min="0" step="1000" placeholder="0" />
          </label>
        </div>
      </fieldset>

      <button type="submit" id="submitBtn">세대별 예상 수령액 계산</button>
    </form>

    <section id="status" class="status"></section>

    <section id="results" class="results" hidden>
      <h2>세대별 비교</h2>
      <div class="cards" id="resultCards"></div>
    </section>

    <p class="disclaimer">
      ※ 본 계산 결과는 표준약관 기준 <strong>추정치</strong>이며, 실제 지급액은 가입 상품·특약·갱신 시점·약관에 따라
      다를 수 있습니다. 정확한 금액은 가입한 보험사에 반드시 확인하세요.
    </p>
  </main>

  <script src="/app.js"></script>
</body>
</html>
